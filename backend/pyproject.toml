[project]
name = "medintel-backend"
version = "1.0.0"
description = "AI Medical Document Intelligence Platform - backend"
requires-python = ">=3.11,<3.13"

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "passlib[bcrypt]>=1.7",
  "python-jose[cryptography]>=3.3",
  "httpx>=0.27",
  "psycopg[binary]>=3.1; sys_platform != 'win32' or platform_python_implementation == 'CPython'",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "scikit-learn>=1.4",
  "numpy>=1.26",
  "rank-bm25>=0.2.2",
  "slowapi>=0.1.9",
  "pytesseract>=0.3.10",
  "pillow>=10.0",
  "bcrypt==4.1.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.4",
]

[tool.setuptools]
packages = ["app", "app.api", "app.api.v1", "app.api.v1.endpoints", "app.core", "app.db", "app.ml", "app.ml.ocr", "app.ml.ingestion", "app.ml.extraction", "app.ml.chunking", "app.ml.embeddings", "app.ml.retrieval", "app.ml.rag", "app.ml.security", "app.ml.summaries", "app.ml.comparison", "app.services", "app.workers", "app.schemas"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# B008: FastAPI's Depends()/File() in defaults is idiomatic, not a bug
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: integration tests (DB, API)", "e2e: full end-to-end pipeline tests"]
filterwarnings = ["ignore::DeprecationWarning:passlib.*"]
